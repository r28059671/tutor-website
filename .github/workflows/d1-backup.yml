# Weekly D1 export to Backblaze B2 (backups/). Complements D1 Time Travel (point-in-time restore).
#
# Retention: keep ~12 weekly backups with a B2 lifecycle rule (one-time setup, see README):
#   prefix backups/, hide 85 days after upload, delete 1 day after hiding.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN (D1), CLOUDFLARE_ACCOUNT_ID,
#   B2_BACKUP_KEY_ID, B2_BACKUP_APP_KEY (key restricted to the bucket and the backups/ prefix),
#   B2_ENDPOINT (host from the bucket page, without https://), B2_REGION, B2_BUCKET.
#
# lessons_fts is an FTS5 virtual table, which `d1 export` can't include, so the base tables
# are exported explicitly. After a restore, use "Rebuild search index" in /admin/structure.
name: D1 backup

on:
  schedule:
    - cron: '30 20 * * 0' # Sundays 20:30 UTC (Monday 02:00 IST)
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Export D1
        run: |
          FILE="d1-$(date -u +%Y-%m-%d).sql"
          echo "FILE=$FILE" >> "$GITHUB_ENV"
          npx --yes wrangler@4 d1 export tutor-db --remote --output "$FILE" \
            --table tracks --table subjects --table chapters --table lessons --table lesson_files --table d1_migrations
      - name: Upload to B2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_BACKUP_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_BACKUP_APP_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.B2_REGION }}
          # Newer AWS CLI checksum defaults can break on S3-compatible stores.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
        run: aws s3 cp "$FILE" "s3://$B2_BUCKET/backups/$FILE" --endpoint-url "https://$B2_ENDPOINT" --content-type application/sql
